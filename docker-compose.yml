
services:
  postgres:
    image: postgres:16-alpine
    container_name: stms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stms_user
      POSTGRES_PASSWORD: stms_password
      POSTGRES_DB: stms_db
    ports:
      - "5433:5432"
    volumes:
      - stms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stms_user -d stms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stms_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - stms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stms_postgres_data:
    name: stms_postgres_data
  stms_redis_data:
    name: stms_redis_data
